<!-- Модальное окно добавления товара -->
<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-plus-circle"></i> Добавить товар</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Название товара:</label>
                    <input type="text" class="form-control" id="itemName" 
                           placeholder="Например: Podonki - яблочные червячки" required>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Себестоимость (BYN):</label>
                        <input type="number" class="form-control" id="itemCostPrice" 
                               step="0.01" min="0" value="10" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Цена продажи (BYN):</label>
                        <input type="number" class="form-control" id="itemSellPrice" 
                               step="0.01" min="0" value="14" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Статус:</label>
                    <select class="form-control" id="itemStatus" required>
                        <option value="в наличии" selected>в наличии</option>
                        <option value="в пути">в пути</option>
                        <option value="зарезервировано">зарезервировано</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Привязать к поставке (опционально):</label>
                    <input type="number" class="form-control" id="itemShipmentId" 
                           placeholder="ID поставки">
                    <small class="form-text text-muted">Оставьте пустым для отдельного товара</small>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="itemIsWholesale">
                    <label class="form-check-label" for="itemIsWholesale">
                        Оптовый товар (не показывать в розничном каталоге)
                    </label>
                </div>
                
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <small>Если товар добавляется в поставку, его статус будет изменен в соответствии со статусом поставки.</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-success" onclick="addItem()">
                    <i class="fas fa-check"></i> Добавить
                </button>
            </div>
        </div>
    </div>
</div>
