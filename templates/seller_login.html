{% extends "base.html" %}

{% block title %}Вход продавца{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-user-tie"></i> Вход для продавца</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form method="POST" action="/seller/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин:</label>
                        <input type="text" class="form-control" id="username" 
                               name="username" required placeholder="Ваш логин">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль:</label>
                        <input type="password" class="form-control" id="password" 
                               name="password" required placeholder="Ваш пароль">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </div>
                </form>
                
                <div class="mt-4 alert alert-info">
                    <h6><i class="fas fa-info-circle"></i> Доступные продавцы:</h6>
                    <ul class="mb-0">
                        <li><strong>SlavchikSV</strong> - Администратор</li>
                        <li><strong>mkozlov</strong> - Главный администратор</li>
                        <li><strong>g_nix</strong> - Продавец</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
