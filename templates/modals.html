<!-- Модальное окно добавления поставки -->
<div class="modal fade" id="addShipmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="fas fa-truck-loading"></i> Новая поставка
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="shipmentForm">
                    <div class="mb-3">
                        <label class="form-label">Дата заказа поставки:</label>
                        <input type="date" class="form-control" id="shipmentOrderDate" 
                               value="{{ now.strftime('%Y-%m-%d') }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Стоимость доставки (BYN):</label>
                        <input type="number" class="form-control" id="shipmentDeliveryCost" 
                               value="10" step="0.01" min="0" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Начальный статус:</label>
                        <select class="form-control" id="shipmentStatus">
                            <option value="в пути" selected>в пути</option>
                            <option value="в наличии">в наличии</option>
                        </select>
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        Номер поставки будет сгенерирован автоматически (SHIP-001, SHIP-002...)
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="createShipment()">
                    Создать поставку
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно добавления товара -->
<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-plus-circle"></i> Добавить товар
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="itemForm">
                    <div class="mb-3">
                        <label class="form-label">Название товара:</label>
                        <input type="text" class="form-control" id="itemName" 
                               placeholder="Например: Podonki - яблочные червячки" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Себестоимость (BYN):</label>
                            <input type="number" class="form-control" id="itemCostPrice" 
                                   step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Цена продажи (BYN):</label>
                            <input type="number" class="form-control" id="itemSellPrice" 
                                   step="0.01" min="0" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Поставка:</label>
                        <select class="form-control" id="itemShipment" required>
                            <option value="">Выберите поставку...</option>
                            <!-- Будет заполняться динамически -->
                        </select>
                    </div>
                    
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Статус товара будет унаследован от поставки
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-success" onclick="addItem()">
                    Добавить товар
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования товара -->
<div class="modal fade" id="editItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">
                    <i class="fas fa-edit"></i> Редактировать товар
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Форма будет здесь -->
            </div>
        </div>
    </div>
</div>
