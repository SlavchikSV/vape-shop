<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .card { margin-bottom: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        
        .status-badge { font-size: 0.8em; }
        .status-в-наличии { background-color: #d1e7dd; }
        .status-в-пути { background-color: #fff3cd; }
        .status-продано { background-color: #f8d7da; }
        .status-зарезервировано { background-color: #cff4fc; }
        .status-взял-себе { background-color: #e7d1ff; }
        
        .live-dot {
            width: 10px; height: 10px; border-radius: 50%;
            display: inline-block; margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 1060; min-width: 300px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store"></i> Магазин
            </a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/buyer">
                    <i class="fas fa-shopping-cart"></i> Покупатель
                </a>
                {% if session.seller_id %}
                    <a class="nav-link" href="/seller/dashboard">
                        <i class="fas fa-user-tie"></i> Панель продавца
                    </a>
                    <a class="nav-link" href="/seller/logout">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </a>
                {% else %}
                    <a class="nav-link" href="/seller/login">
                        <i class="fas fa-sign-in-alt"></i> Продавец
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="mt-5 py-3 text-center text-muted">
        <div class="container">
            <small>Магазин &copy; {{ now().year }}</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Функция для показа уведомлений
        function showToast(message, type = 'info') {
            const toastId = 'toast-' + Date.now();
            const toastHTML = `
                <div id="${toastId}" class="toast show" role="alert">
                    <div class="toast-header bg-${type} text-white">
                        <strong class="me-auto">${type === 'success' ? 'Успешно' : 'Ошибка'}</strong>
                        <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.remove()"></button>
                    </div>
                    <div class="toast-body">${message}</div>
                </div>
            `;
            
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            
            container.insertAdjacentHTML('beforeend', toastHTML);
            setTimeout(() => {
                const toast = document.getElementById(toastId);
                if (toast) toast.remove();
            }, 5000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
