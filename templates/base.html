<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .card { margin-bottom: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .status-badge { font-size: 0.8em; }
        .in-stock { background-color: #d1e7dd; }
        .in-transit { background-color: #fff3cd; }
        .sold { background-color: #f8d7da; }
        .personal { background-color: #cff4fc; }
        
        /* Стили для toast-уведомлений */
        .toast { animation: slideInRight 0.3s ease-out; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Анимация для бейджа уведомлений */
        .notification-badge {
            animation: pulse 1.5s infinite;
        }

        @keyframes smooth-pulse {
            0% {
                opacity: 0.3;
                transform: scale(0.95);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 0.3;
                transform: scale(0.95);
            }
        }

        .live-pulse {
            animation: smooth-pulse 1.5s ease-in-out infinite;
        }

        #live-dot {
            font-size: 0.7em;
            vertical-align: middle;
            display: inline-block;
        }
        
        /* Стили для dropdown */
        .dropdown-menu {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        /* Стили для активных продавцов */
        .active-seller-item:hover {
            background-color: #f8f9fa;
        }

        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        /* Анимация для предупреждения о сессии */
        @keyframes session-warning {
            0% { background-color: #fff3cd; }
            50% { background-color: #ffeaa7; }
            100% { background-color: #fff3cd; }
        }
        
        .session-warning {
            animation: session-warning 2s infinite;
        }

        /* Стили для таблиц */
        th[style*="cursor: pointer"]:hover {
            background-color: #e9ecef;
        }

        .sort-asc::after {
            content: " ▲";
            font-size: 0.8em;
            color: #0d6efd;
        }

        .sort-desc::after {
            content: " ▼";
            font-size: 0.8em;
            color: #0d6efd;
        }
        
        /* Стили для модальных окон */
        .modal-header.bg-primary,
        .modal-header.bg-success,
        .modal-header.bg-info,
        .modal-header.bg-warning {
            color: white;
        }
        
        /* Стили для полей ввода цен */
        .price-input {
            max-width: 120px;
        }
        
        /* Стили для карточек поставок */
        .shipment-card {
            transition: transform 0.2s;
        }
        
        .shipment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,.1);
        }
        
        /* Стили для текстового поля массового ввода */
        #itemsTextArea {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store"></i> Магазин
            </a>
            
            <div class="navbar-nav">
                <a class="nav-link" href="/buyer">
                    <i class="fas fa-shopping-cart"></i> Покупатель
                </a>
                {% if session.seller_logged_in %}
                    <a class="nav-link" href="/seller/dashboard">
                        <i class="fas fa-user-tie"></i> Продавец
                    </a>
                    <a class="nav-link" href="/seller/logout">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </a>
                {% else %}
                    <a class="nav-link" href="/seller/login">
                        <i class="fas fa-sign-in-alt"></i> Продавец
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="mt-5 py-3 text-center text-muted">
        <div class="container">
            <small>Магазин &copy; {{ now.year }}</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    
    <!-- АГРЕССИВНАЯ ПРОВЕРКА СЕССИИ ДЛЯ ПРОДАВЦОВ -->
    {% if session.seller_logged_in %}
    <script>
    // Простой таймаут сессии - 60 минут
    setTimeout(() => {
        if (confirm('Ваша сессия истекет. Продолжить?')) {
            location.reload();
        } else {
            window.location.href = '/seller/logout';
        }
    }, 1800000); // 30 минут
    </script>
    {% endif %}
</body>
</html>
